<div class="admin-categories">
  <div class="page-header">
    <h1>Categories</h1>
    <button class="btn btn-primary" (click)="openAdd()">+ Add Category</button>
  </div>

  @if (loading()) {
    <p class="loading">Loading...</p>
  } @else {
    <div class="table-wrapper">
      <table>
        <thead><tr><th>Name</th><th>Slug</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>
          @for (c of categories(); track c.id) {
            <tr>
              <td><strong>{{ c.name }}</strong></td>
              <td>{{ c.slug }}</td>
              <td><span class="badge" [class.active]="c.is_active" [class.inactive]="!c.is_active">{{ c.is_active ? 'Active' : 'Inactive' }}</span></td>
              <td>
                <button class="action-btn edit" (click)="openEdit(c)">Edit</button>
                <button class="action-btn delete" (click)="deleteCategory(c.id)">Delete</button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }

  @if (showForm) {
    <div class="modal-overlay" (click)="showForm = false">
      <div class="modal-content" (click)="$event.stopPropagation()">
        <h2>{{ editingId ? 'Edit' : 'Add' }} Category</h2>
        <form (ngSubmit)="save()">
          <div class="form-group"><label>Name</label><input [(ngModel)]="form.name" name="name" (input)="autoSlug()" required /></div>
          <div class="form-group"><label>Slug</label><input [(ngModel)]="form.slug" name="slug" required /></div>
          <div class="form-group"><label>Description</label><textarea [(ngModel)]="form.description" name="desc" rows="3"></textarea></div>
          <div class="form-group"><label>Image URL</label><input [(ngModel)]="form.image_url" name="image" /></div>
          <div class="form-group">
            <label>Parent Category</label>
            <select [(ngModel)]="form.parent_id" name="parent">
              <option [ngValue]="null">None (Top Level)</option>
              @for (c of categories(); track c.id) { <option [ngValue]="c.id">{{ c.name }}</option> }
            </select>
          </div>
          <label class="checkbox"><input type="checkbox" [(ngModel)]="form.is_active" name="active" /> Active</label>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">{{ editingId ? 'Update' : 'Create' }}</button>
            <button type="button" class="btn btn-outline" (click)="showForm = false">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  }
</div>
